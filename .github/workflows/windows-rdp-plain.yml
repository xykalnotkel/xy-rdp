name: Xydesk RDP (Plain)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password untuk user Xydesk'
        required: true
        default: 'Xydesk@2026#Cloud$99'
        type: string
      duration:
        description: 'Durasi RDP (jam, max 6)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
      rdp_port:
        description: 'Port RDP'
        required: true
        default: '13389'
        type: string
      tunnel_target:
        description: 'Tunnel target (rdp.xyc.my.id atau "none" untuk direct IP)'
        required: true
        default: 'rdp.xyc.my.id'
        type: string

jobs:
  rdp:
    name: Xydesk RDP (Plain)
    runs-on: windows-2022
    permissions:
      contents: read

    env:
      DESKTOP_USER: Xydesk
      DESKTOP_PASSWORD: ${{ github.event.inputs.password }}
      RDP_PORT: ${{ github.event.inputs.rdp_port }}
      SESSION_HOURS: ${{ github.event.inputs.duration }}
      TUNNEL_TARGET: ${{ github.event.inputs.tunnel_target }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}

    steps:
      - name: Setup Xydesk user
        shell: pwsh
        run: |
          powercfg -change -standby-timeout-ac 0
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -disk-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          
          secedit /export /cfg $env:TEMP\secpol.cfg /quiet | Out-Null
          (Get-Content $env:TEMP\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content $env:TEMP\secpol.cfg
          secedit /configure /db $env:TEMP\secedit.sdb /cfg $env:TEMP\secpol.cfg /quiet | Out-Null
          net accounts /minpwage:0 | Out-Null
          
          $securePass = ConvertTo-SecureString $env:DESKTOP_PASSWORD -AsPlainText -Force
          $existing = Get-LocalUser -Name $env:DESKTOP_USER -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-LocalUser -Name $env:DESKTOP_USER -Password $securePass -FullName "Xydesk Admin" -PasswordNeverExpires -UserMayNotChangePassword
          } else {
            Set-LocalUser -Name $env:DESKTOP_USER -Password $securePass
          }
          Add-LocalGroupMember -Group "Administrators" -Member $env:DESKTOP_USER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:DESKTOP_USER -ErrorAction SilentlyContinue
          Disable-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          Write-Host "User $env:DESKTOP_USER created"

      - name: Configure RDP + Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "PortNumber" -Value $env:RDP_PORT -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 4 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "Xydesk RDP" -Direction Inbound -Protocol TCP -LocalPort $env:RDP_PORT -Action Allow -Profile Any -ErrorAction SilentlyContinue
          Disable-NetFirewallRule -DisplayGroup "File And Printer Sharing" -ErrorAction SilentlyContinue
          Restart-Service TermService -Force
          Start-Sleep 5
          Write-Host "RDP on port $env:RDP_PORT"

      - name: Setup Cloudflare Tunnel (quick tunnel mode)
        if: env.CLOUDFLARE_TUNNEL_TOKEN != '' && env.TUNNEL_TARGET != 'none'
        shell: pwsh
        continue-on-error: true
        run: |
          $cfExe = "C:\tools\cloudflared.exe"
          if (-not (Test-Path $cfExe)) {
            New-Item -ItemType Directory -Path "C:\tools" -Force | Out-Null
            Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cfExe
          }
          # Stop existing
          Stop-Service Cloudflared -Force -ErrorAction SilentlyContinue
          sc.exe delete Cloudflared 2>$null | Out-Null
          Start-Sleep 2
          # Install as service
          & $cfExe service install $env:CLOUDFLARE_TUNNEL_TOKEN 2>$null
          Start-Sleep 3
          sc.exe start Cloudflared 2>$null
          Start-Sleep 8
          $svc = Get-Service Cloudflared -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -eq 'Running') {
            Write-Host "Cloudflare Tunnel running (service mode)"
          } else {
            Write-Host "WARNING: Service mode failed, but RDP still active on port $env:RDP_PORT"
          }

      - name: Get connection info
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias "Ethernet*" | Select-Object -First 1).IPAddress
          $tunnelStatus = "disabled"
          $svc = Get-Service Cloudflared -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -eq 'Running') { $tunnelStatus = "active" }
          
          $summary = @"
          ==============================================
            XYDESK RDP READY
          ==============================================
            User:     $env:DESKTOP_USER
            Pass:     $env:DESKTOP_PASSWORD
            Port:     $env:RDP_PORT
            Lifetime: $env:SESSION_HOURS hours
            Cloudflare: $tunnelStatus
          ==============================================
            DIRECT IP (GHA internal, ga accessible):
              $ip
          ==============================================
            TO CONNECT:
            1. Install 'cloudflared' di device kamu
               https://github.com/cloudflare/cloudflared/releases
            2. Run:
               cloudflared access rdp --hostname $env:TUNNEL_TARGET --url localhost:$env:RDP_PORT
            3. Buka Microsoft Remote Desktop
               -> localhost:$env:RDP_PORT
               -> user: $env:DESKTOP_USER
               -> pass: $env:DESKTOP_PASSWORD
          ==============================================
          "@
          $summary | Out-File -FilePath "$env:GITHUB_STEP_SUMMARY" -Encoding utf8
          Write-Host $summary

      - name: Keep session alive
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddHours([int]$env:SESSION_HOURS)
          Write-Host "Session will end at: $endTime"
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "Time remaining: $($remaining.ToString('hh\:mm\:ss'))"
            try {
              $ts = Get-Service TermService -ErrorAction Stop
              if ($ts.Status -ne 'Running') { Start-Service TermService }
            } catch {}
            Start-Sleep 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: Write-Host "Cleanup done"
