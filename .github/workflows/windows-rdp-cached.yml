name: Xydesk Windows RDP (Cached)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password untuk user Xydesk (min 8 char, alphanumeric + special char WAJIB)'
        required: true
        default: 'Xydesk@2026#Cloud$99'
        type: string
      duration:
        description: 'Durasi RDP hidup (jam, max 6)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      rdp_port:
        description: 'Port RDP (default 3389, saran: 13389 untuk stealth)'
        required: true
        default: '13389'
        type: string
      install_ai:
        description: 'Install Ollama + LM Studio?'
        required: true
        default: 'true'
        type: boolean
      install_docker:
        description: 'Install Docker Desktop?'
        required: true
        default: 'true'
        type: boolean
      use_cache:
        description: 'Gunakan cache installer & runtime (recommended, jauh lebih cepat)'
        required: true
        default: 'true'
        type: boolean

jobs:
  rdp:
    name: Windows Server RDP - Xydesk (Cached)
    runs-on: windows-2022
    
    permissions:
      contents: read
    
    env:
      DESKTOP_USER: Xydesk
      DESKTOP_PASSWORD: ${{ github.event.inputs.password }}
      RDP_PORT: ${{ github.event.inputs.rdp_port }}
      SESSION_HOURS: ${{ github.event.inputs.duration }}
      INSTALL_AI: ${{ github.event.inputs.install_ai }}
      INSTALL_DOCKER: ${{ github.event.inputs.install_docker }}
      USE_CACHE: ${{ github.event.inputs.use_cache }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      # Dev environment versions (updated 2026-09-04)
      NODE_VERSION: '24.11.0-lts'
      PYTHON_VERSION: '3.13.7'
      GO_VERSION: '1.25.1'
      RUST_VERSION: '1.91.0'
      JAVA_VERSION: '25'
      DOTNET_VERSION: '9.0.108'
      PHP_VERSION: '8.4.12'
      RUBY_VERSION: '3.4.5'
      VSCODE_VERSION: '1.96.0'
      OLLAMA_VERSION: '0.11.10'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # CACHE: Installers (downloads)
      # ============================================
      - name: Cache installers & tools
        if: env.USE_CACHE == 'true'
        uses: actions/cache@v4
        with:
          path: |
            C:\tools\installers
            C:\nodejs
            C:\python313
            C:\Java
            C:\go
            C:\php
            C:\dotnet
            C:\Tools\ninja
            C:\BuildTools
            C:\Program Files\Ollama
            C:\ProgramData\Chocolatey\bin
            C:\Users\Xydesk\.cargo
            C:\Users\Xydesk\.rustup
          key: xydesk-installers-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ env.PYTHON_VERSION }}-${{ env.JAVA_VERSION }}-${{ env.GO_VERSION }}-${{ env.RUST_VERSION }}-${{ env.DOTNET_VERSION }}-${{ env.PHP_VERSION }}-${{ env.RUBY_VERSION }}
          restore-keys: |
            xydesk-installers-${{ runner.os }}-

      - name: Setup Xydesk user + RDP
        shell: pwsh
        run: |
          powercfg -change -standby-timeout-ac 0
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -disk-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          
          secedit /export /cfg $env:TEMP\secpol.cfg /quiet | Out-Null
          (Get-Content $env:TEMP\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content $env:TEMP\secpol.cfg
          secedit /configure /db $env:TEMP\secedit.sdb /cfg $env:TEMP\secpol.cfg /quiet | Out-Null
          net accounts /minpwage:0 | Out-Null
          
          $securePass = ConvertTo-SecureString $env:DESKTOP_PASSWORD -AsPlainText -Force
          $existing = Get-LocalUser -Name $env:DESKTOP_USER -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-LocalUser -Name $env:DESKTOP_USER -Password $securePass -FullName "Xydesk Admin" -Description "Custom RDP admin for Xydesk Cloud" -PasswordNeverExpires -UserMayNotChangePassword
          } else {
            Set-LocalUser -Name $env:DESKTOP_USER -Password $securePass
          }
          
          Add-LocalGroupMember -Group "Administrators" -Member $env:DESKTOP_USER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:DESKTOP_USER -ErrorAction SilentlyContinue
          Disable-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          
          Write-Host "User $env:DESKTOP_USER created with admin privileges"

      - name: Configure RDP + Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "PortNumber" -Value $env:RDP_PORT -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 4 -Force
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "Xydesk Custom RDP" -Direction Inbound -Protocol TCP -LocalPort $env:RDP_PORT -Action Allow -Profile Any -ErrorAction SilentlyContinue
          Disable-NetFirewallRule -DisplayGroup "File And Printer Sharing" -ErrorAction SilentlyContinue
          
          Restart-Service TermService -Force
          Start-Sleep 5
          
          Write-Host "RDP configured on port $env:RDP_PORT with TLS 1.3"

      # ============================================
      # PYTHON
      # ============================================
      - name: Install Python 3.13 (cached)
        shell: pwsh
        run: |
          $pythonPath = "C:\python313"
          if (Test-Path "$pythonPath\python.exe") {
            Write-Host "Python found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;$pythonPath;$pythonPath\Scripts", [EnvironmentVariableTarget]::Machine)
            $env:Path = "$env:Path;$pythonPath;$pythonPath\Scripts"
            py -m pip install --upgrade pip setuptools wheel 2>$null
            Write-Host "Python ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $url = "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-amd64.exe"
            $out = "C:\tools\installers\python-installer.exe"
            Invoke-WebRequest -Uri $url -OutFile $out
            Start-Process -FilePath $out -ArgumentList "/quiet","InstallAllUsers=1","PrependPath=1","TargetDir=$pythonPath","Include_test=0","Include_doc=0","Include_launcher=1" -Wait
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;$pythonPath;$pythonPath\Scripts", [EnvironmentVariableTarget]::Machine)
            $env:Path = "$env:Path;$pythonPath;$pythonPath\Scripts"
            py -m pip install --upgrade pip setuptools wheel
            py -m pip install --upgrade requests numpy pandas fastapi uvicorn httpx pydantic
            Write-Host "Python $env:PYTHON_VERSION installed (fresh)"
          }

      # ============================================
      # NODE.JS
      # ============================================
      - name: Install Node.js 24 LTS (cached)
        shell: pwsh
        run: |
          $nodePath = "C:\nodejs"
          $nodeVer = $env:NODE_VERSION.Replace('-lts','')
          $expectedExe = "$nodePath\node.exe"
          if (Test-Path $expectedExe) {
            Write-Host "Node.js found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;$nodePath", [EnvironmentVariableTarget]::Machine)
            $env:Path = "$env:Path;$nodePath"
            Write-Host "Node.js ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $arch = "win-x64"
            $zip = "node-v$nodeVer-$arch.zip"
            $url = "https://nodejs.org/dist/v$nodeVer/$zip"
            $out = "C:\tools\installers\$zip"
            Invoke-WebRequest -Uri $url -OutFile $out
            Expand-Archive -Path $out -DestinationPath $nodePath -Force
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;$nodePath", [EnvironmentVariableTarget]::Machine)
            $env:Path = "$env:Path;$nodePath"
            corepack enable
            corepack prepare pnpm@latest --activate
            npm install -g npm@latest typescript@latest ts-node@latest nodemon@latest pnpm@latest yarn@latest
            Write-Host "Node.js 24 LTS installed (fresh)"
          }

      # ============================================
      # JAVA
      # ============================================
      - name: Install Java 25 LTS (cached)
        shell: pwsh
        run: |
          $javaRoot = "C:\Java"
          $jdkPath = Get-ChildItem $javaRoot -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($jdkPath -and (Test-Path "$($jdkPath.FullName)\bin\java.exe")) {
            Write-Host "Java found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("JAVA_HOME", $jdkPath.FullName, [EnvironmentVariableTarget]::Machine)
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;$($jdkPath.FullName)\bin", [EnvironmentVariableTarget]::Machine)
            Write-Host "Java ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25%2B36/OpenJDK25U-jdk_x64_windows_hotspot_25_36.zip"
            $out = "C:\tools\installers\jdk25.zip"
            Invoke-WebRequest -Uri $url -OutFile $out
            Expand-Archive -Path $out -DestinationPath $javaRoot -Force
            $jdkPath = (Get-ChildItem $javaRoot | Select-Object -First 1).FullName
            [Environment]::SetEnvironmentVariable("JAVA_HOME", $jdkPath, [EnvironmentVariableTarget]::Machine)
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;$jdkPath\bin", [EnvironmentVariableTarget]::Machine)
            Write-Host "Java 25 installed (fresh)"
          }

      # ============================================
      # C++ BUILD TOOLS (VS Build Tools - the heaviest)
      # ============================================
      - name: Install C++ Build Tools + CMake (cached)
        shell: pwsh
        run: |
          $vsPath = "C:\BuildTools\VC\Tools\MSVC"
          if (Test-Path $vsPath) {
            Write-Host "VS Build Tools found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\Tools\ninja", [EnvironmentVariableTarget]::Machine)
            $env:Path = "$env:Path;C:\Tools\ninja"
            Write-Host "C++ Build Tools ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $vsBootstrapper = "C:\tools\installers\vs_buildtools.exe"
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $vsBootstrapper
            $vsArgs = @("--quiet", "--wait", "--norestart", "--nocache", "--add", "Microsoft.VisualStudio.Workload.VCTools", "--includeRecommended", "--installPath", "C:\BuildTools")
            Start-Process -FilePath $vsBootstrapper -ArgumentList $vsArgs -Wait
            
            # CMake
            $cmakeInstaller = "C:\tools\installers\cmake-installer.msi"
            Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-windows-x86_64.msi" -OutFile $cmakeInstaller
            Start-Process msiexec.exe -ArgumentList "/i","$cmakeInstaller","/quiet","ADD_CMAKE_TO_PATH=System" -Wait
            
            # Ninja
            New-Item -ItemType Directory -Path "C:\Tools\ninja" -Force | Out-Null
            Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.13.1/ninja-win.zip" -OutFile "C:\tools\installers\ninja.zip"
            Expand-Archive -Path "C:\tools\installers\ninja.zip" -DestinationPath "C:\Tools\ninja" -Force
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\Tools\ninja", [EnvironmentVariableTarget]::Machine)
            Write-Host "C++ Build Tools + CMake installed (fresh)"
          }

      # ============================================
      # RUST
      # ============================================
      - name: Install Rust (cached)
        shell: pwsh
        run: |
          $cargoPath = "C:\Users\Xydesk\.cargo\bin\cargo.exe"
          if (Test-Path $cargoPath) {
            Write-Host "Rust found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\Users\Xydesk\.cargo\bin", [EnvironmentVariableTarget]::Machine)
            Write-Host "Rust ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "C:\tools\installers\rustup-init.exe"
            # Run as Xydesk user
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = "C:\tools\installers\rustup-init.exe"
            $psi.Arguments = "-y --default-toolchain $env:RUST_VERSION --profile minimal"
            $psi.UserName = "Xydesk"
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $true
            $psi.Password = (ConvertTo-SecureString $env:DESKTOP_PASSWORD -AsPlainText -Force)
            $proc = [System.Diagnostics.Process]::Start($psi)
            $proc.WaitForExit()
            Write-Host "Rust $env:RUST_VERSION installed (fresh)"
          }

      # ============================================
      # GO
      # ============================================
      - name: Install Go 1.25 (cached)
        shell: pwsh
        run: |
          $goPath = "C:\go\bin\go.exe"
          if (Test-Path $goPath) {
            Write-Host "Go found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("GOROOT", "C:\go", [EnvironmentVariableTarget]::Machine)
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\go\bin", [EnvironmentVariableTarget]::Machine)
            Write-Host "Go ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $goZip = "go$($env:GO_VERSION).windows-amd64.zip"
            Invoke-WebRequest -Uri "https://go.dev/dl/$goZip" -OutFile "C:\tools\installers\$goZip"
            Expand-Archive -Path "C:\tools\installers\$goZip" -DestinationPath "C:\" -Force
            [Environment]::SetEnvironmentVariable("GOROOT", "C:\go", [EnvironmentVariableTarget]::Machine)
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\go\bin", [EnvironmentVariableTarget]::Machine)
            Write-Host "Go $env:GO_VERSION installed (fresh)"
          }

      # ============================================
      # PHP + COMPOSER
      # ============================================
      - name: Install PHP 8.4 (cached)
        shell: pwsh
        run: |
          $phpExe = "C:\php\php.exe"
          if (Test-Path $phpExe) {
            Write-Host "PHP found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\php", [EnvironmentVariableTarget]::Machine)
            $env:Path = "$env:Path;C:\php"
            Write-Host "PHP ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $phpZip = "php-$env:PHP_VERSION-Win32-vs17-x64.zip"
            try {
              Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/archives/$phpZip" -OutFile "C:\tools\installers\$phpZip" -ErrorAction Stop
            } catch {
              Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/php-$env:PHP_VERSION-Win32-vs17-x64.zip" -OutFile "C:\tools\installers\$phpZip"
            }
            Expand-Archive -Path "C:\tools\installers\$phpZip" -DestinationPath "C:\php" -Force
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\php", [EnvironmentVariableTarget]::Machine)
            $env:Path = "$env:Path;C:\php"
            Invoke-WebRequest -Uri "https://getcomposer.org/installer" -OutFile "C:\tools\installers\composer-setup.php"
            php "C:\tools\installers\composer-setup.php" --install-dir=C:\php --filename=composer
            Write-Host "PHP $env:PHP_VERSION + Composer installed (fresh)"
          }

      # ============================================
      # RUBY
      # ============================================
      - name: Install Ruby 3.4 (cached)
        shell: pwsh
        run: |
          $rubyPath = "C:\Ruby34-x64\bin\ruby.exe"
          if (Test-Path $rubyPath) {
            Write-Host "Ruby found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\Ruby34-x64\bin", [EnvironmentVariableTarget]::Machine)
            Write-Host "Ruby ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $rubyMsi = "rubyinstaller-$env:RUBY_VERSION-1-x64.exe"
            Invoke-WebRequest -Uri "https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-$env:RUBY_VERSION-1/$rubyMsi" -OutFile "C:\tools\installers\$rubyMsi"
            Start-Process -FilePath "C:\tools\installers\$rubyMsi" -ArgumentList "/quiet","/norestart" -Wait
            Write-Host "Ruby $env:RUBY_VERSION installed (fresh)"
          }

      # ============================================
      # .NET
      # ============================================
      - name: Install .NET 9 SDK (cached)
        shell: pwsh
        run: |
          $dotnetExe = "C:\dotnet\dotnet.exe"
          if (Test-Path $dotnetExe) {
            Write-Host ".NET found in cache, skipping download"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\dotnet", [EnvironmentVariableTarget]::Machine)
            Write-Host ".NET ready (cached)"
          } else {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "C:\tools\installers\dotnet-install.ps1"
            & "C:\tools\installers\dotnet-install.ps1" -Channel 9.0 -InstallDir "C:\dotnet"
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;C:\dotnet", [EnvironmentVariableTarget]::Machine)
            Write-Host ".NET 9 installed (fresh)"
          }

      # ============================================
      # VS CODE + EXTENSIONS
      # ============================================
      - name: Install VS Code (cached)
        shell: pwsh
        run: |
          $vscodeExe = "C:\Program Files\Microsoft VS Code\Code.exe"
          if (-not (Test-Path $vscodeExe)) {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            Invoke-WebRequest -Uri "https://update.code.visualstudio.com/latest/win32-x64/stable" -OutFile "C:\tools\installers\vscode-installer.exe"
            Start-Process -FilePath "C:\tools\installers\vscode-installer.exe" -ArgumentList "/quiet","/norestart","/mergetasks=!runcode,addcontextmenufiles,addcontextmenufolders,addtopath" -Wait
            Write-Host "VS Code installed (fresh)"
          } else {
            Write-Host "VS Code found in cache"
          }
          
          # Install extensions (always check, takes only ~30s)
          $code = "C:\Program Files\Microsoft VS Code\bin\code.cmd"
          & $code --install-extension ms-python.python 2>$null
          & $code --install-extension dbaeumer.vscode-eslint 2>$null
          & $code --install-extension esbenp.prettier-vscode 2>$null
          & $code --install-extension ms-vscode.cpptools 2>$null
          & $code --install-extension rust-lang.rust-analyzer 2>$null
          & $code --install-extension ms-dotnettools.csharp 2>$null
          & $code --install-extension vscjava.vscode-java-pack 2>$null
          & $code --install-extension golang.Go 2>$null
          & $code --install-extension PKief.material-icon-theme 2>$null
          & $code --install-extension Continue.continue 2>$null
          & $code --install-extension RooCodeInc.roo-cline 2>$null
          Write-Host "VS Code + extensions ready"

      # ============================================
      # GIT + GH CLI
      # ============================================
      - name: Install Git + GitHub CLI (cached)
        shell: pwsh
        run: |
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $gitInstaller = "C:\tools\installers\git-installer.exe"
            Invoke-WebRequest -Uri "https://github.com/git-for-windows/git/releases/download/v2.51.0.windows.1/Git-2.51.0-64-bit.exe" -OutFile $gitInstaller
            Start-Process -FilePath $gitInstaller -ArgumentList "/VERYSILENT","/NORESTART","/NOCANCEL","/SP-","/CLOSEAPPLICATIONS","/RESTARTAPPLICATIONS","/COMPONENTS=icons,ext,ext\reg,ext\reg\shellhere,autoupdate,windowsterminal,scalar" -Wait
            Write-Host "Git installed (fresh)"
          } else {
            Write-Host "Git found in cache"
          }
          
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            $ghMsi = "C:\tools\installers\gh-installer.msi"
            Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.83.0/gh_2.83.0_windows_amd64.msi" -OutFile $ghMsi
            Start-Process msiexec.exe -ArgumentList "/i","$ghMsi","/quiet" -Wait
            Write-Host "GitHub CLI installed (fresh)"
          } else {
            Write-Host "GitHub CLI found in cache"
          }

      # ============================================
      # BROWSERS + DEV TOOLS
      # ============================================
      - name: Install browsers + dev tools (cached)
        shell: pwsh
        run: |
          if (-not (Get-Command chrome -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $chromeMsi = "C:\tools\installers\chrome-installer.msi"
            Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome/install/GoogleChromeStandaloneEnterprise64.msi" -OutFile $chromeMsi
            Start-Process msiexec.exe -ArgumentList "/i","$chromeMsi","/quiet" -Wait
            Write-Host "Chrome installed"
          }
          
          if (-not (Test-Path "C:\Users\Xydesk\AppData\Local\Postman\Postman.exe")) {
            $postmanExe = "C:\tools\installers\postman-setup.exe"
            Invoke-WebRequest -Uri "https://dl.pstmn.io/download/latest/win64" -OutFile $postmanExe
            Start-Process -FilePath $postmanExe -ArgumentList "/S" -Wait
            Write-Host "Postman installed"
          }
          
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            $7zInstaller = "C:\tools\installers\7z-setup.exe"
            Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2501-x64.exe" -OutFile $7zInstaller
            Start-Process -FilePath $7zInstaller -ArgumentList "/S" -Wait
            Write-Host "7-Zip installed"
          }
          
          Write-Host "All browsers + tools ready"

      - name: Install Ollama (if enabled)
        if: env.INSTALL_AI == 'true'
        shell: pwsh
        run: |
          $ollamaExe = "C:\Users\Xydesk\AppData\Local\Programs\Ollama\ollama.exe"
          if (-not (Test-Path $ollamaExe)) {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $ollamaSetup = "C:\tools\installers\ollama-setup.exe"
            Invoke-WebRequest -Uri "https://ollama.com/download/OllamaSetup.exe" -OutFile $ollamaSetup
            Start-Process -FilePath $ollamaSetup -ArgumentList "/S" -Wait
            Start-Sleep 10
            Write-Host "Ollama installed"
          } else {
            Write-Host "Ollama found in cache"
          }
          & $ollamaExe pull llama3.2:3b 2>$null
          & $ollamaExe pull qwen2.5-coder:7b 2>$null

      - name: Install Docker Desktop (if enabled)
        if: env.INSTALL_DOCKER == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Path "C:\tools\installers" -Force | Out-Null
            $dockerMsi = "C:\tools\installers\docker-installer.exe"
            Invoke-WebRequest -Uri "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -OutFile $dockerMsi
            Start-Process -FilePath $dockerMsi -ArgumentList "install","--quiet","--accept-license" -Wait
            Write-Host "Docker Desktop installed"
          } else {
            Write-Host "Docker Desktop found in cache"
          }

      - name: Setup Tailscale (private network)
        if: env.TAILSCALE_AUTH_KEY != ''
        shell: pwsh
        run: |
          if (-not (Get-Command tailscale -ErrorAction SilentlyContinue)) {
            $tailscaleMsi = "C:\tools\installers\tailscale-setup.msi"
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $tailscaleMsi
            Start-Process msiexec.exe -ArgumentList "/i","$tailscaleMsi","/quiet","/norestart" -Wait
          }
          Start-Sleep 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=xydesk-rdp
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Tailscale connected: $tsIP"

      - name: Setup Cloudflare Tunnel (public domain)
        if: env.CLOUDFLARE_TUNNEL_TOKEN != ''
        shell: pwsh
        run: |
          $cfExe = "C:\tools\cloudflared.exe"
          if (-not (Test-Path $cfExe)) {
            New-Item -ItemType Directory -Path "C:\tools" -Force | Out-Null
            Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cfExe
          }
          
          # Stop existing service if any
          & $cfExe service uninstall 2>$null
          Start-Sleep 2
          & $cfExe service install $env:CLOUDFLARE_TUNNEL_TOKEN
          Start-Sleep 5
          & $cfExe service start
          Start-Sleep 10
          
          Write-Host "Cloudflare Tunnel running"

      - name: Customize desktop (Xydesk theme)
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "AppsUseLightTheme" -Value 0 -Force
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name "SystemUsesLightTheme" -Value 0 -Force
          
          $wallpaperPath = "C:\Windows\Web\Wallpaper\Xydesk\xydesk-wallpaper.jpg"
          New-Item -ItemType Directory -Path (Split-Path $wallpaperPath) -Force | Out-Null
          
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1920,1080
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $gradient = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
            (New-Object System.Drawing.Point 0,0),
            (New-Object System.Drawing.Point 1920,1080),
            [System.Drawing.Color]::FromArgb(255,15,23,42),
            [System.Drawing.Color]::FromArgb(255,99,102,241)
          )
          $g.FillRectangle($gradient, 0, 0, 1920, 1080)
          
          $font = New-Object System.Drawing.Font("Segoe UI", 80, [System.Drawing.FontStyle]::Bold)
          $brush = [System.Drawing.Brushes].[White]
          $text = "XYDESK"
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString($text, $font, $brush, 960, 480, $sf)
          
          $subfont = New-Object System.Drawing.Font("Segoe UI", 24)
          $g.DrawString("Cloud RDP | Powered by GitHub Actions", $subfont, $brush, 960, 600, $sf)
          $bmp.Save($wallpaperPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $g.Dispose()
          $bmp.Dispose()
          
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value $wallpaperPath -Force
          rundll32.exe user32.dll, UpdatePerUserSystemParameters 1, True
          
          $shell = New-Object -ComObject WScript.Shell
          $taskbar = "$env:APPDATA\Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar"
          $vscodeShortcut = "$taskbar\Visual Studio Code.lnk"
          $vscodeTarget = "C:\Program Files\Microsoft VS Code\Code.exe"
          if (Test-Path $vscodeTarget) {
            $s = $shell.CreateShortcut($vscodeShortcut)
            $s.TargetPath = $vscodeTarget
            $s.Save()
          }
          
          Write-Host "Custom Xydesk desktop applied"

      - name: Apply security hardening
        shell: pwsh
        run: |
          $services = @("RemoteRegistry", "SSDPSRV", "upnphost", "WMPNetworkSvc")
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          
          Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $false
          Update-MpSignature
          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          net accounts /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15 | Out-Null
          auditpol /set /category:"Logon/Logoff" /success:enable /failure:enable | Out-Null
          auditpol /set /category:"Account Management" /success:enable /failure:enable | Out-Null
          
          Write-Host "Security hardening applied"

      - name: Get connection info
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias "Ethernet*" | Select-Object -First 1).IPAddress
          
          $tailscaleIP = ""
          if (Get-Command tailscale -ErrorAction SilentlyContinue) {
            $tailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
          }
          
          $output = @"
          ==============================================================
                          XYDESK RDP READY (CACHED)
          ==============================================================
          
            Username:  $env:DESKTOP_USER
            Password:  $env:DESKTOP_PASSWORD
            RDP Port:  $env:RDP_PORT
            Lifetime:  $env:SESSION_HOURS hours
            Cache:     $env:USE_CACHE
          
            Direct IP:  $ip
          ==============================================================
          "@
          
          $output | Out-File -FilePath "$env:GITHUB_STEP_SUMMARY" -Encoding utf8
          Write-Host $output
          
          @{
            username = $env:DESKTOP_USER
            password = $env:DESKTOP_PASSWORD
            port = $env:RDP_PORT
            ip = $ip
            tailscale_ip = $tailscaleIP
            cloudflare_domain = $env:CLOUDFLARE_TUNNEL_ID
          } | ConvertTo-Json | Out-File "C:\Users\Public\xydesk-credentials.json" -Encoding utf8

      - name: Keep session alive
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddHours([int]$env:SESSION_HOURS)
          Write-Host "Session will end at: $endTime"
          
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "Time remaining: $($remaining.ToString('hh\:mm\:ss'))"
            
            try {
              $ts = Get-Service TermService -ErrorAction Stop
              if ($ts.Status -ne 'Running') { Start-Service TermService }
            } catch {}
            
            Start-Sleep 300
          }
          
          Write-Host "Session ending..."

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-Item "C:\Users\Public\xydesk-credentials.json" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\AppData\Local\Google\Chrome\User Data\Default\History" -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup done"
